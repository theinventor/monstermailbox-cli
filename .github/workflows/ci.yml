name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules tidy
        if: matrix.os == 'ubuntu-latest'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      # Regression guards for the v0.2.0 silent-register bug. Run them
      # explicitly (in addition to `go test ./...` above) so a future
      # accidental rename / removal of these tests trips CI immediately
      # instead of silently dropping coverage.
      - name: Regression — no silent failures + correct API URL
        run: |
          go test -run 'TestDefaultAPIURLIsAPISubdomain' ./internal/client/...
          go test -run 'TestEveryAPICommandSurfacesEmpty4xxAsAVisibleError' ./cmd/...
          go test -run 'TestEveryAPICommandPrintsBodyAndStillErrorsOnNon2xx' ./cmd/...
          go test -run 'TestPassthroughJSONStatusCodeClassification' ./cmd/...

      - name: Vet
        run: go vet ./...
