name: monstermailbox
label: MonsterMailbox
kind: platform
version: 0.5.0
description: >
  MonsterMailbox gateway adapter for Hermes. Streams inbound agent email over the
  MonsterMailbox SSE event feed (mmb inbox watch / GET /events) and wakes the agent
  to run its own email-handling skill (which triages, replies, and dispositions via
  the mmb CLI). Thin trigger — the plugin never auto-replies. No public webhook
  endpoint required.
author: MonsterMailbox
requires_env: []
optional_env:
  - name: MMB_ALLOWED_SENDERS
    description: "Comma-separated sender addresses allowed to drive the agent (default: rely on server trust state)"
    prompt: "Allowed senders (comma-separated, blank = trusted-only)"
    password: false
  - name: MMB_BIN
    description: "Path to the mmb binary (default: 'mmb' on PATH)"
    prompt: "mmb binary path"
    password: false
